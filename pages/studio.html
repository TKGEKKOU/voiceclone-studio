<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceClone Studio</title><style>body{font:15px system-ui;background:#f5f6f8;color:#20242b;margin:0}main{max-width:900px;margin:48px auto;padding:0 24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.panel{background:white;border:1px solid #e2e5ea;border-radius:8px;padding:22px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;margin:12px 0}input{flex:1;padding:10px;border:1px solid #ccd1d9;border-radius:5px}button{padding:10px 16px;border:0;border-radius:5px;background:#1677ff;color:#fff;cursor:pointer}button.secondary{background:#eef1f5;color:#303640}.status{color:#6b7280}.voice{padding:12px 0;border-top:1px solid #edf0f3}.ok{color:#16803c}.err{color:#c73535}small{color:#6b7280}</style></head><body><main><div class="head"><div><h1>VoiceClone Studio</h1><small>独立运行的语音克隆工作室</small></div><span class="status" id="state">未连接</span></div><section class="panel"><h2>连接信息</h2><div class="row"><label>Token</label><input id="token" type="text"><button id="save">保存</button></div><div class="row"><button id="test">测试 API</button><span id="message"></span></div></section><section class="panel"><h2>音色目录</h2><div id="voices">点击“读取音色”检查当前工作室音色。</div><button class="secondary" id="load">读取音色</button></section></main><script>const $=id=>document.getElementById(id);let currentToken='';async function call(path,opt={}){const token=currentToken||$("token").value.trim();const r=await fetch(path,{...opt,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}$("save").onclick=async()=>{try{if(!currentToken)throw Error('请先用当前 Token 测试连接');await call('/api/config/token',{method:'POST',body:JSON.stringify({token:$("token").value.trim()})});currentToken=$("token").value.trim();localStorage.vcsToken=currentToken;$("message").textContent='Token 已保存到 Studio';$("state").textContent='已连接';$("state").className='ok'}catch(e){$("message").textContent=e.message}};$("test").onclick=async()=>{try{await call('/api/health');currentToken=$("token").value.trim();localStorage.vcsToken=currentToken;$("state").textContent='已连接';$("state").className='ok';$("message").textContent='连接成功'}catch(e){$("state").textContent='连接失败';$("state").className='err';$("message").textContent=e.message}};$("load").onclick=async()=>{try{const d=await call('/api/voices');$("voices").innerHTML=(d.voices||[]).map(v=>`<div class=voice><b>${v.name}</b> · ${v.language} · ${v.status}</div>`).join('')||'暂无音色'}catch(e){$("voices").textContent=e.message}};if(localStorage.vcsToken){$("token").value=localStorage.vcsToken;$("test").click();}</script></body></html>
